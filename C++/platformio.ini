[platformio]
default_envs = nodo_sensor

; ============================================
; CONFIGURACIÓN BASE
; ============================================
[esp32_common]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_mode = qio

; ============================================
; ENTORNO TRANSMISOR (Node) - ESP-Now Remote Sensor
; ============================================
[env:nodo_sensor]
extends = esp32_common
; Actualizado según dmesg -w: ttyACM0 (USB Single Serial) es el puerto de Programación
upload_port = /dev/ttyACM1
monitor_port = /dev/ttyACM0

lib_deps =
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.11.0

; FILTRO ESTRICTO: Solo main_transmisor.cpp y compartidos
build_src_filter = 
    -<*>                          # Excluir TODO primero
    +<main_node.cpp>              # Protocol V2 Node Firmware
    +<communications/EspNowStrategy.cpp>
    +<core/*.cpp>
    +<core/Node.cpp>
    +<hardware/sensors/*.cpp>

; Configuración Monitor Serie (Input Fix)
monitor_dtr = 1
monitor_rts = 1
monitor_echo = yes
monitor_filters = default, send_on_enter

lib_archive = no                 # Importante para evitar conflictos

; ============================================
; ENTORNO GATEWAY (Receptor) - Bridge UART <-> ESP-Now
; ============================================
[env:gateway]
extends = esp32_common
; Actualizado para Linux/Ubuntu - Usando /dev/ttyACM0
upload_port = /dev/ttyACM1
monitor_port = /dev/ttyACM0

; FILTRO ESTRICTO: Solo main_receptor.cpp y compartidos
build_src_filter = 
    -<*>                          # Excluir TODO primero
    +<main_gateway.cpp>          # Incluir SOLO receptor (ruta relativa a src/)
    +<communications/UartStrategy.cpp>
    +<communications/EspNowStrategy.cpp>
    +<communications/GatewayStrategy.cpp>
    +<core/*.cpp>

; Configuración Monitor Serie (Input Fix)
monitor_dtr = 1
monitor_rts = 1
monitor_echo = yes
monitor_filters = default, send_on_enter

lib_archive = no                 # Importante para evitar conflictos
; ============================================
; ENTORNO NATIVE (Pruebas Unitarias en PC)
; ============================================
[env:native]
platform = native
test_framework = unity
test_build_src = yes
; lib_deps = fabiobatsilva/ArduinoFake ; DISABLED: We use internal mock in UartStrategy.h
build_src_filter = 
    -<*>
    +<communications/EspNowStrategy.cpp>
    +<core/*.cpp>
    +<hardware/sensors/*.cpp>
    +<../test/mocks/Arduino.cpp>
build_flags = 
    -std=gnu++17
    -D NATIVE_ENV
    -D UNIT_TEST
    -I include
    -I include
    -I src
    -I test/mocks

; ============================================
; ENTORNO SIMULADOR E2E (Ejecutable Pipe)
; ============================================
[env:simulator]
platform = native
build_src_filter = 
    -<*>
    +<main_simulator.cpp>
    +<communications/UartStrategy.cpp>
    +<core/ProtocolEngine.cpp>
    +<core/GpioController.cpp>
    +<core/SystemContext.cpp>
    -std=gnu++17
    -D NATIVE_ENV

; ============================================
; ENTORNO TEST ESP-NOW 1 (Gateway Role)
; ============================================
[env:test_espnow_1]
extends = esp32_common
upload_port = /dev/ttyACM1
monitor_port = /dev/ttyACM0
build_src_filter = 
    -<*>
    +<main_esp_now_1.cpp>

; ============================================
; ENTORNO TEST ESP-NOW 2 (Node Role)
; ============================================
[env:test_espnow_2]
extends = esp32_common
upload_port = /dev/ttyACM1
monitor_port = /dev/ttyACM0
build_src_filter = 
    -<*>
    +<main_esp_now_2.cpp>

; ============================================
; ENTORNO DEBUG UART (Test Hardware)
; ============================================
[env:debug_uart]
extends = esp32_common
upload_port = /dev/ttyACM1
monitor_port = /dev/ttyACM0
build_src_filter = +<main_uart_test.cpp>

; ============================================
; ENTORNO ACTUADOR VENTANA (Node)
; ============================================
[env:nodo_actuador]
extends = esp32_common
upload_port = /dev/ttyACM1
monitor_port = /dev/ttyACM0
build_src_filter = 
    -<*>
    +<main_node_actuador_ventana.cpp>
    +<communications/EspNowStrategy.cpp>
    +<core/*.cpp>

