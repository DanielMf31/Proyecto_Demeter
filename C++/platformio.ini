[platformio]
default_envs = transmisor

; ============================================
; CONFIGURACIÓN BASE
; ============================================
[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_mode = qio

; ============================================
; ENTORNO DE DESARROLLO (Manual)
; ============================================
[env:desarrollo]
; Este entorno NO filtra nada - tú controlas qué main.cpp usas
upload_port = 
monitor_port = 
; Sin filtros - tú renombras main.cpp según necesites

; ============================================
; ENTORNO TRANSMISOR (COM9) - SOLO transmisor
; ============================================
[env:transmisor]
upload_port = COM9
monitor_port = COM9

; FILTRO ESTRICTO: Solo main_transmisor.cpp y compartidos
build_src_filter = 
    -<*>                          # Excluir TODO primero
    +<src/main_transmisor.cpp>    # Incluir SOLO transmisor
    +<src/Compartidos>            # Incluir archivos compartidos

lib_archive = no                 # Importante para evitar conflictos

; ============================================
; ENTORNO RECEPTOR (COM10) - SOLO receptor
; ============================================
[env:receptor]
upload_port = COM10
monitor_port = COM10

; FILTRO ESTRICTO: Solo main_receptor.cpp y compartidos
build_src_filter = 
    -<*>                          # Excluir TODO primero
    +<src/main_receptor.cpp>      # Incluir SOLO receptor
    +<src/Compartidos>            # Incluir archivos compartidos

lib_archive = no                 # Importante para evitar conflictos