# ==========================================
# STAGING OVERRIDE CONFIGURATION
# ==========================================
# Despliegue en portátil accesible via Cloudflare Tunnel en patata.monters.org
#
# Uso:
#   make staging       ← arranca todo + túnel Cloudflare
#   make staging-down  ← para todo
#
# Acceso (una vez levantado):
#   https://patata.monters.org   → Frontend
#   https://patata.monters.org/api/docs → Swagger API
#   localhost:5175   → Frontend directo (sin túnel)
#   localhost:8001   → API directo (sin túnel)

services:

  # ─── Cloudflare Tunnel ────────────────────────────────────────────────────
  # Expone el stack de staging en patata.monters.org sin abrir puertos
  # El token se obtiene en: dash.cloudflare.com → Zero Trust → Tunnels
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: demeter-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    environment:
      - TUNNEL_TRANSPORT_PROTOCOL=http2
    networks:
      - demeter-net
    depends_on:
      - frontend
      - api

  # ─── Frontend ─────────────────────────────────────────────────────────────
  frontend:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Software/Servidor/docker/frontend/Dockerfile # build de producción
      args:
        VITE_API_URL: ${VITE_API_URL:-https://patata.monters.org/api}
        VITE_WS_URL: ${VITE_WS_URL:-wss://patata.monters.org/ws}
        VITE_DEV_LOGIN: ${VITE_DEV_LOGIN:-false}
    ports:
      - "5175:80" # acceso directo sin túnel
    environment:
      - VITE_API_URL=https://patata.monters.org/api
      - VITE_WS_URL=wss://patata.monters.org/ws

  # ─── API ──────────────────────────────────────────────────────────────────
  api:
    restart: unless-stopped
    ports:
      - "8001:8000" # acceso directo sin túnel
    environment:
      - DEMETER_ENV=staging
      - DEBUG=True
      - DATABASE_URL=postgresql://${DEMETER_POSTGRES_USER:-postgres}:${DEMETER_POSTGRES_PASSWORD:-postgres_local_pass}@demeter-db:5432/${DEMETER_POSTGRES_DB:-demeter_staging}
      - REDIS_URL=redis://demeter-redis:6379/0
      - RQ_REDIS_URL=redis://demeter-redis:6379/1

  # ─── Workers ──────────────────────────────────────────────────────────────
  math-worker:
    restart: unless-stopped

  sequencer:
    restart: unless-stopped

  # ─── Base de datos ────────────────────────────────────────────────────────
  db:
    restart: unless-stopped
    ports:
      - "5433:5432" # acceso directo para debugging con psql
    environment:
      - POSTGRES_USER=${DEMETER_POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${DEMETER_POSTGRES_PASSWORD:-postgres_local_pass}
      - POSTGRES_DB=${DEMETER_POSTGRES_DB:-demeter_staging}
    volumes:
      - postgres_staging:/var/lib/postgresql/data # volumen aislado

  # ─── Redis ────────────────────────────────────────────────────────────────
  redis:
    restart: unless-stopped
    ports:
      - "6381:6379" # acceso directo para redis-cli

volumes:
  postgres_staging: # volumen aislado — no mezcla datos con dev ni prod
