name: CI (Develop)

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  test-cpp:
    name: Test Firmware (C++)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      - name: Cache PlatformIO
        uses: actions/cache@v3
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('**/platformio.ini') }}
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Run PlatformIO Native Tests
        run: |
          cd C++
          pio test -e native

  test-python:
    name: Test Backend & GUI (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip' # caching pip dependencies

      - name: Install Dependencies
        run: |
          # Install TKinter dependencies for GUI tests if needed (headless)
          sudo apt-get update
          sudo apt-get install -y python3-tk tk-dev
          
          pip install -r Python/requirements.txt
          pip install pytest pytest-asyncio

      - name: Run Pytest
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/Python/src
          # Use xvfb to mock display for GUI tests if they launch windows
          sudo apt-get install -y xvfb
          xvfb-run -a pytest Python/tests
