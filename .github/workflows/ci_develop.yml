name: CI (Develop)

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  test-all:
    name: Universal Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      - name: Cache PlatformIO
        uses: actions/cache@v3
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('**/platformio.ini') }}

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Install Dependencies
        run: |
          # Python environment dependencies (Backend & Raspberry)
          python -m pip install --upgrade pip
          pip install -r Software/Servidor/Backend/requirements.txt
          pip install -r Software/Raspberry/requirements.txt
          pip install pytest pytest-asyncio httpx

          # Frontend Node environment
          cd Software/Servidor/Frontend/Demeter-React
          npm install

      - name: Run All Tests (Makefile)
        run: make test-all
