name: CD (Main - Deploy)

on:
  push:
    branches: [ "main" ]

jobs:
  test-cpp:
    name: Test Firmware (C++)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      - name: Cache PlatformIO
        uses: actions/cache@v3
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('**/platformio.ini') }}
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Run PlatformIO Native Tests
        run: |
          cd C++
          pio test -e native

  test-python:
    name: Test Backend & GUI (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk tk-dev xvfb
          pip install -r Python/requirements.txt
          pip install pytest pytest-asyncio

      - name: Run Pytest
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/Python/src
          xvfb-run -a pytest Python/tests

  build-and-push:
    name: Build Docker Image
    needs: [test-cpp, test-python]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: frontend
            context: .
            dockerfile: docker/frontend/Dockerfile
            platforms: linux/amd64
          - image: backend
            context: .
            dockerfile: docker/backend/Dockerfile
            platforms: linux/amd64
          - image: pi-core
            context: ./Python
            dockerfile: Python/docker/core/Dockerfile
            platforms: linux/amd64,linux/arm64
          - image: pi-ws
            context: ./Python
            dockerfile: Python/docker/ws/Dockerfile
            platforms: linux/amd64,linux/arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
