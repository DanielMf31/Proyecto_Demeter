name: CD (Main - Deploy)

on:
  push:
    branches: [ "main" ]

jobs:
  test-all:
    name: Universal Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      - name: Cache PlatformIO
        uses: actions/cache@v3
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('**/platformio.ini') }}

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Install Dependencies
        run: |
          # Python environment dependencies (Backend & Raspberry)
          python -m pip install --upgrade pip
          pip install -r Software/Servidor/Backend/requirements.txt
          pip install -r Software/Raspberry/requirements.txt
          pip install pytest pytest-asyncio httpx

          # Frontend Node environment
          cd Software/Servidor/Frontend/Demeter-React
          npm install

      - name: Run All Tests (Makefile)
        run: make test-all

  build-and-push:
    name: Build Docker Image
    needs: [test-all]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Servidor (x86) ──
          - image: frontend
            context: .
            dockerfile: Software/Servidor/docker/frontend/Dockerfile
            platforms: linux/amd64
            build-args: |
              VITE_API_URL=https://patata.monters.org/api
              VITE_WS_URL=wss://patata.monters.org/ws
              VITE_DEV_LOGIN=true
          - image: backend
            context: .
            dockerfile: Software/Servidor/docker/backend/Dockerfile
            platforms: linux/amd64
            build-args: ""
          # ── Raspberry Pi (ARM64) ──
          - image: gateway
            context: .
            dockerfile: Software/Raspberry/Dockerfile
            platforms: linux/arm64
            build-args: ""
          - image: local-ui
            context: .
            dockerfile: Software/Servidor/docker/frontend/Dockerfile.rpi
            platforms: linux/arm64
            build-args: |
              VITE_API_URL=/api
              VITE_WS_URL=/ws

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=raw,value=0.4

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
