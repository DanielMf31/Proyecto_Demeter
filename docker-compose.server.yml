version: '3.8'

services:
  # ----------------------------------------------------------------
  # 1. FRONTEND (Nginx Static)
  # ----------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Software/Servidor/docker/frontend/Dockerfile
    container_name: demeter-frontend
    ports:
      - "80:80"
    env_file:
      - .env
    restart: always

  # ----------------------------------------------------------------
  # 2. BACKEND (FastAPI - Main Instance)
  # ----------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Software/Servidor/docker/backend/Dockerfile
    container_name: demeter-backend
    env_file:
      - .env
    environment:
      - DEMETER_ENV=production
    ports:
      - "8000:8000"
    restart: always
    depends_on:
      - redis
      - db

  # ----------------------------------------------------------------
  # 3. DATABASE (PostgreSQL - Data Persistence)
  # ----------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: demeter-db
    environment:
      - POSTGRES_USER=${DEMETER_POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${DEMETER_POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${DEMETER_POSTGRES_DB:-demeter_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  # ----------------------------------------------------------------
  # REDIS: Mandatory for Discovery & Command Coordination
  # ----------------------------------------------------------------
  redis:
    image: redis:alpine
    container_name: demeter-redis
    ports:
      - "6379:6379"
    restart: always

volumes:
  postgres_data:
