version: '3.8'

services:
  # ----------------------------------------------------------------
  # 1. FRONTEND (Nginx Static)
  # ----------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Software/Servidor/docker/frontend/Dockerfile
    container_name: demeter-frontend
    ports:
      - "80:80"
    restart: always

  # ----------------------------------------------------------------
  # 2. BACKEND (FastAPI - Main Instance)
  # ----------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Software/Servidor/docker/backend/Dockerfile
    container_name: demeter-backend
    environment:
      - DEMETER_ENV=production
      - REDIS_URL=redis://redis:6379 # Optional if you add Redis later
    ports:
      - "8000:8000"
    restart: always
    # extra_hosts:
    #   - "host.docker.internal:host-gateway" # Access host if needed

    # ----------------------------------------------------------------
    # OPTIONAL: REDIS (Commented out for now as requested)
    # ----------------------------------------------------------------
    # redis:
    #   image: redis:alpine
    #   container_name: demeter-redis
    #   ports:
    #     - "6379:6379"
