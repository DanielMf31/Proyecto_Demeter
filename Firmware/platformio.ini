[platformio]
default_envs = gateway

; ============================================
; CONFIGURACIÓN BASE
; ============================================
[esp32_common]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_mode = qio
monitor_dtr = 1
monitor_rts = 1
monitor_echo = yes
monitor_filters = default, send_on_enter
lib_archive = no

lib_deps =
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.11.0

build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; ============================================
; ENTORNO GATEWAY (Receptor)
; ============================================
[env:gateway]
extends = esp32_common
upload_port = /dev/ttyACM1
monitor_port = /dev/ttyACM0
build_src_filter = 
    -<*>
    +<main_gateway.cpp>
    +<communications/UartStrategy.cpp>
    +<communications/EspNowStrategy.cpp>
    +<communications/GatewayStrategy.cpp>
    +<core/*.cpp>
    +<hardware/sensors/*.cpp>

; ============================================
; ENTORNO SENSOR (Node 2)
; ============================================
[env:sensor]
extends = esp32_common
upload_port = /dev/ttyACM1
monitor_port = /dev/ttyACM0
build_src_filter = 
    -<*>
    +<main_node_sensor.cpp>
    +<communications/EspNowStrategy.cpp>
    +<core/*.cpp>
    +<hardware/sensors/*.cpp>
build_flags = 
    -D NODE_ID=2
    -D MOCK_DATA_ENABLED

; ============================================
; ENTORNO SENSOR (Node 3 - Debugging Actuator)
; ============================================
[env:sensor_node_3]
extends = esp32_common
upload_port = /dev/ttyACM1
monitor_port = /dev/ttyACM0
build_src_filter = 
    -<*>
    +<main_node_sensor.cpp>
    +<communications/EspNowStrategy.cpp>
    +<core/*.cpp>
    +<hardware/sensors/*.cpp>
build_flags = 
    -D NODE_ID=3
    -D MOCK_DATA_ENABLED

; ============================================
; ENTORNO ACTUADOR (Node)
; ============================================
[env:actuador]
extends = esp32_common
upload_port = /dev/ttyACM1
monitor_port = /dev/ttyACM0
build_src_filter = 
    -<*>
    +<main_node_actuador.cpp>
    +<communications/EspNowStrategy.cpp>
    +<core/*.cpp>
build_flags = 
    -D NODE_ID=3
lib_deps =
    ${esp32_common.lib_deps}
    fastled/FastLED @ ^3.6.0

; ============================================
; UTILIDAD: OBTENER MAC
; ============================================
[env:get_mac]
extends = esp32_common
upload_port = /dev/ttyACM1
monitor_port = /dev/ttyACM0
build_src_filter =
    -<*>
    +<main_get_mac.cpp>

; ============================================
; UTILIDAD: TEST DE SENSORES (DS18B20 + Capacitivo v1.2)
; ============================================
[env:sensor_test]
extends = esp32_common
upload_port = /dev/ttyACM1
monitor_port = /dev/ttyACM0
build_src_filter =
    -<*>
    +<main_sensor_test.cpp>
    +<hardware/sensors/*.cpp>

; ============================================
; SENSOR CLUSTER (Nodo con N plantas, ESP-NOW)
; ============================================
[env:sensor_cluster]
extends = esp32_common
upload_port = /dev/ttyACM1
monitor_port = /dev/ttyACM1
build_src_filter =
    -<*>
    +<main_sensor_cluster.cpp>
    +<communications/EspNowStrategy.cpp>
    +<core/ProtocolEngine.cpp>
    +<hardware/sensors/*.cpp>
build_flags =
    ${esp32_common.build_flags}
    -D NODE_ID=2

; ============================================
; ENTORNO NATIVE (Pruebas Unitarias en PC)
; ============================================
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = 
    -<*>
    +<communications/*.cpp>
    +<core/*.cpp>
    +<hardware/sensors/*.cpp>
    +<../test/mocks/Arduino.cpp>
build_flags = 
    -std=gnu++17
    -D NATIVE_ENV
    -D UNIT_TEST
    -I include
    -I src
    -I test/mocks

; ============================================
; ENTORNO INTEGRATION (Pruebas E2E en PC)
; ============================================
[env:integration]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = 
    -<*>
    +<communications/*.cpp>
    +<core/*.cpp>
    +<hardware/sensors/*.cpp>
    +<../test/mocks/Arduino.cpp>
    +<../test/test_integration/*.cpp>
build_flags = 
    -std=gnu++17
    -D NATIVE_ENV
    -D UNIT_TEST
    -I include
    -I src
    -I test/mocks
    -I test/test_integration
