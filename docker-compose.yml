# ==========================================
# BASE DOCKER COMPOSE CONFIGURATION
# ==========================================
# This file defines the core services, networks, and volumes for the Demeter Platform.
# It serves as the FOUNDATION for all environments (Dev, Staging, Prod).
# CRITICAL: No `ports:` are exposed here for security. Services communicate via the internal `demeter-net` network.

services:
  # 1. FRONTEND
  frontend:
    build:
      context: .
      dockerfile: Software/Servidor/docker/frontend/Dockerfile
    container_name: demeter-frontend
    env_file:
      - .env
    networks:
      - demeter-net

  # 2. BACKEND API
  api:
    build:
      context: .
      dockerfile: Software/Servidor/docker/backend/Dockerfile
    container_name: demeter-api
    env_file:
      - .env
    volumes:
      - shared_data:/app/shared
      - export_data:/app/exports
    environment:
      - REDIS_URL=redis://demeter-redis:6379/0
      - RQ_REDIS_URL=redis://demeter-redis:6379/1
      - DATABASE_URL=postgresql://postgres:postgres_local_pass@demeter-db:5432/demeter_db
    depends_on:
      - redis
      - db
    networks:
      - demeter-net

  math-worker:
    build:
      context: .
      dockerfile: Software/Servidor/docker/backend/Dockerfile
    container_name: demeter-math-worker
    command: rq worker demeter_tasks --url redis://demeter-redis:6379/1
    env_file:
      - .env
    volumes:
      - shared_data:/app/shared
      - export_data:/app/exports
    environment:
      - REDIS_URL=redis://demeter-redis:6379/0
      - RQ_REDIS_URL=redis://demeter-redis:6379/1
      - DATABASE_URL=postgresql://postgres:postgres_local_pass@demeter-db:5432/demeter_db
    depends_on:
      - redis
      - db
    networks:
      - demeter-net

  sequencer:
    build:
      context: .
      dockerfile: Software/Servidor/docker/backend/Dockerfile
    container_name: demeter-sequencer
    command: python Software/Servidor/Backend/Secuenciador/main.py
    env_file:
      - .env
    volumes:
      - shared_data:/app/shared
    environment:
      - REDIS_URL=redis://demeter-redis:6379/0
      - RQ_REDIS_URL=redis://demeter-redis:6379/1
      - DATABASE_URL=postgresql://postgres:postgres_local_pass@demeter-db:5432/demeter_db
    depends_on:
      - redis
      - db
    networks:
      - demeter-net

  # 4. DATABASE (PostgreSQL)
  db:
    image: postgres:15-alpine
    container_name: demeter-db
    environment:
      - POSTGRES_USER=${DEMETER_POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${DEMETER_POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${DEMETER_POSTGRES_DB:-demeter_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - demeter-net

  # 5. REDIS BROKER
  redis:
    image: redis:alpine
    container_name: demeter-redis
    networks:
      - demeter-net

networks:
  demeter-net:
    driver: bridge

volumes:
  shared_data:
  postgres_data:
  export_data:
