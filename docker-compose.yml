services:
  demeter-core:
    build:
      context: .
      dockerfile: Software/Raspberry/Dockerfile
    container_name: demeter-core
    privileged: true
    volumes:
      - ./Software/Raspberry/data:/app/Software/Raspberry/data
      - ./Software/Raspberry/logs:/app/Software/Raspberry/logs
    devices:
      - "/dev/serial0:/dev/serial0"
    environment:
      - DEMETER_PORT=/dev/serial0
      # Point to specific internal paths
      - DEMETER_LOG_FILE=/app/Software/Raspberry/logs/demeter.log
      - DEMETER_DB_NAME=demeter.db
      - PYTHONUNBUFFERED=1
    restart: always
    # network_mode: host # Uncomment if needed for local network discovery
